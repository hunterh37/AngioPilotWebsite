<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AngioPilot — Scenario-Based Vascular Catheterization Simulation Training Tool</title>
<meta name="description" content="AngioPilot — Scenario-Based Vascular Catheterization Simulation Training Tool. Departure: Femoral Artery. Arrival: Splenic Artery.">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

<main class="ticket">

  <!-- TOP MAROON BAR -->
  <div class="bar top"></div>

  <!-- MAIN PANEL -->
  <section class="panel">

    <div class="wordmark-wrap">
      <svg class="jet" viewBox="0 0 120 120" aria-hidden="true">
        <path d="M112 44 L74 36 L44 8 L34 8 L48 40 L24 40 L14 26 L6 26 L12 48 L6 70 L14 70 L24 56 L48 56 L34 88 L44 88 L74 60 L112 52 C118 51 118 45 112 44 Z"/>
      </svg>
      <svg class="trail" viewBox="0 0 700 60" aria-hidden="true">
        <path d="M8 50 C 180 46, 400 30, 690 8"/>
      </svg>
      <h1 class="wordmark">A<span class="lower">ngio</span>P<span class="lower">ilot</span></h1>
    </div>

    <p class="tagline">Scenario-Based Vascular Catheterization<br>Simulation Training Tool</p>

    <div class="stops">
      <div class="stop">
        <span class="icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 19.5h19v2h-19zM22.2 10.4c-.3-1.1-1.4-1.7-2.5-1.4l-5 1.3-6.5-6.1-2.2.6 3.9 6.8-4.7 1.3-1.9-1.5-1.6.4 2.2 3.8 17.6-4.7c1.1-.3 1.7-1.4 1.4-2.5z"/></svg>
        </span>
        <span class="stop-text">
          <span class="stop-label">Departure</span>
          <span class="stop-value">Femoral Artery</span>
        </span>
      </div>
      <div class="stop">
        <span class="icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 19.5h19v2h-19zM21.7 13.3c-.3 1.1-1.4 1.7-2.5 1.4L2.3 10.2l-.6-5.3 1.7.4 1.4 2.2 4.7 1.2L8.3 1l2.2.6 3.7 8.2 5 1.3c1.1.3 1.8 1.4 1.5 2.2z"/></svg>
        </span>
        <span class="stop-text">
          <span class="stop-label">Arrival</span>
          <span class="stop-value">Splenic Artery</span>
        </span>
      </div>
    </div>

  </section>

  <!-- PERFORATION -->
  <div class="perf" aria-hidden="true"></div>

  <!-- STUB -->
  <section class="panel stub">

    <div class="ready-wrap">
      <svg class="sparkle s1" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z"/></svg>
      <svg class="sparkle s2" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z"/></svg>
      <p class="ready">Ready for<br>Takeoff?</p>
      <svg class="cloud" viewBox="0 0 120 50" aria-hidden="true"><path d="M20 46 C6 46 4 30 18 28 C18 12 40 8 46 20 C52 8 76 8 80 22 C96 18 108 30 100 40 C96 46 88 46 84 46 Z"/></svg>
    </div>

    <div class="qr">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
      <svg viewBox="0 0 116 116" aria-hidden="true">
        <g class="qr-dots"></g>
        <rect class="fp" x="6" y="6" width="26" height="26"/>
        <rect class="fp-in" x="13" y="13" width="12" height="12"/>
        <rect class="fp" x="84" y="6" width="26" height="26"/>
        <rect class="fp-in" x="91" y="13" width="12" height="12"/>
        <rect class="fp" x="6" y="84" width="26" height="26"/>
        <rect class="fp-in" x="13" y="91" width="12" height="12"/>
        <path class="qr-jet" d="M84 56 L57 51 L38 33 L32 33 L41 51 L26 51 L19 43 L14 43 L18 56 L14 69 L19 69 L26 61 L41 61 L32 79 L38 79 L57 61 L84 58 C88 57.5 88 56.5 84 56 Z"/>
      </svg>
    </div>

    <a class="btn" href="mailto:demo@medvr.io?subject=AngioPilot%20Demo">Book Demo</a>

  </section>

  <!-- BOTTOM MAROON BAR -->
  <div class="bar bottom">
    <span>Take Your Skills Further</span>
    <svg class="dots-jet" viewBox="0 0 40 16" aria-hidden="true">
      <circle cx="2" cy="9" r="1.3"/><circle cx="7" cy="9" r="1.3"/><circle cx="12" cy="9" r="1.3"/>
      <path d="M38 6 L28 4 L21 0 L18 0 L22 5 L15 5 L12 2 L9 2 L11 6.5 L9 11 L12 11 L15 8 L22 8 L18 13 L21 13 L28 9 L38 7 C39.5 6.8 39.5 6.2 38 6 Z"/>
    </svg>
  </div>

</main>

<script>
(function () {
  var g = document.querySelector('.qr-dots');
  if (!g) return;
  var NS = 'http://www.w3.org/2000/svg';
  var C = 116, S = 4, N = Math.floor(C / S);
  function inFinder(x, y) {
    return (x < 34 && y < 34) || (x > 80 && y < 34) || (x < 34 && y > 80);
  }
  function inJet(x, y) { return x > 27 && x < 75 && y > 39 && y < 71; }
  var seed = 20260919;
  function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
  for (var i = 0; i < N; i++) {
    for (var j = 0; j < N; j++) {
      var x = i * S + 1, y = j * S + 1;
      if (inFinder(x, y) || inJet(x, y)) continue;
      if (rnd() > 0.46) continue;
      var r = document.createElementNS(NS, 'rect');
      r.setAttribute('x', x); r.setAttribute('y', y);
      r.setAttribute('width', S - 1.2); r.setAttribute('height', S - 1.2);
      g.appendChild(r);
    }
  }
})();
</script>

</body>
</html>
